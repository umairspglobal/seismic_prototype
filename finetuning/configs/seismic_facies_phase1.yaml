# @package _global_
#
# ============================================================================
# Phase 1 fine-tuning config for the "seismic facies" noun_phrase, adapted
# from facebookresearch/sam3's own
# sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml
# (verified against that file directly - every _target_ path below is a real
# class in the sam3 repo as of the "SAM 3.1" release). Sections marked
# "VERIFY" use a real, working mechanism from that repo but weren't tested
# end-to-end against this exact dataset - grep the named file in your
# installed sam3 checkout before a long training run if something errors.
#
# Phase 1 = decoder-only: vision encoder + text encoder are frozen by
# giving their parameter groups a learning rate of 0 (there is no
# `freeze_encoder=True` flag in sam3/model_builder.py - freezing here is
# done the same way this repo already does per-group LR control).
# ============================================================================

defaults:
  - _self_

paths:
  dataset_root: C:/Users/U/Downloads/Seismic_SAM/seismic_prototype/finetune_data
  experiment_log_dir: C:/Users/U/Downloads/Seismic_SAM/seismic_prototype/finetune_logs/seismic_facies_phase1_subset
  bpe_path: C:/Users/U/Downloads/Seismic_SAM/seismic_prototype/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  # Local sam3.pt (or HF snapshot) to start from - the pretrained checkpoint,
  # NOT a checkpoint you already fine-tuned.
  init_checkpoint: C:/Users/U/.cache/huggingface/hub/models--facebook--sam3/snapshots/3c879f39826c281e95690f02c7821c4de09afae7/sam3.pt

seismic_train:
  # Single noun_phrase for this dataset - see finetuning/prepare_dataset.py
  category_name: "seismic facies"

  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        # Horizontal flip only - vertical flip and 90-degree rotation would
        # invert the down-is-time / across-is-trace convention this app's
        # geometry code relies on (seismic_app/preprocessing.py), so they
        # are deliberately NOT included here.
        - _target_: sam3.train.transforms.basic_for_api.RandomHorizontalFlip
          consistent_transform: true
          p: 0.5
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: false
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # VERIFY: BCE+Dice segmentation loss (uncommented/adapted from the real
  # config's commented-out "loss to be used for training in case of
  # segmentation" block). weight_dict values are the guide's suggested
  # starting point, not tuned for this dataset.
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict:
          loss_ce: 5.0
          presence_loss: 5.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: true
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 20.0   # BCE (focal) term - was 200.0, implicated in the gradient blowups that corrupted the epoch-0 checkpoint
          loss_dice: 10.0    # Dice term
        compute_aux: false
    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: true  # REQUIRED for this fine-tune - masks must flow through

  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  use_presence_eval: true
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: true
    use_original_sizes_box: true
  use_presence: ${scratch.use_presence_eval}

  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: false
  scale_by_find_batch_size: true

  resolution: 1008  # NOTE: hardcoded in model_builder._create_vit_backbone's rope/pos-embed - do not change without also updating that
  consistent_transform: false
  max_ann_per_img: 20  # 1 class, far fewer objects/image than the 100-class roboflow default

  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  num_train_workers: 0
  num_val_workers: 0
  max_data_epochs: 2
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Phase 1 freeze: vision + text backbone learning rates are 0.
  lr_scale: 1.0
  lr_transformer: 2e-4  # was 8e-4 - implicated in ~144 gradient-overflow events that corrupted the epoch-0 checkpoint
  lr_vision_backbone: 0.0   # frozen
  lr_language_backbone: 0.0 # frozen
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 15
  scheduler_warmup: 5
  scheduler_cooldown: 15

  val_batch_size: 1
  # 12GB consumer GPU at resolution=1008: batch_size=1 avoids OOM (see
  # finetuning/README.md's Common errors table).
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: seismic_facies
    with_seg_masks: true

  gradient_accumulation_steps: 1
  train_batch_size: 1
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: true

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: true
  skip_first_val: true
  max_epochs: 1  # subset run (~1000 images) so Phase 1 fits a same-day budget
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 100  # skip in-loop val; use finetuning/validate_checkpoint.py after convert
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    # gloo, not nccl - NCCL isn't built into Windows torch wheels; gloo is
    # fine here since this is a single-GPU/single-process run.
    backend: gloo
    find_unused_parameters: true
    gradient_as_bucket_view: false
    static_graph: false

  loss:
    all: ${seismic_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        # VERIFY: COCO_FROM_JSON is used for the *val* split in the real
        # roboflow config; using it here for train too since our JSON is
        # plain COCO (not roboflow's export flavor).
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 1
          _partial_: true
        load_segmentation: true
        transforms: ${seismic_train.train_transforms}
        max_ann_per_img: 20
        multiplier: 1
        max_train_queries: 100
        max_val_queries: 100
        training: true
        use_caching: false
        img_folder: ${paths.dataset_root}/images/train/
        ann_file: ${paths.dataset_root}/train.json
      shuffle: true
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: false
      drop_last: true
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: true
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 1
          _partial_: true
        img_folder: ${paths.dataset_root}/images/val/
        ann_file: ${paths.dataset_root}/val.json
        transforms: ${seismic_train.val_transforms}
        max_ann_per_img: 100
        multiplier: 1
        training: false
      shuffle: false
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: false
      drop_last: false
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpu   # trainer moves to GPU itself; keep false init off the load path
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}
    checkpoint_path: ${paths.init_checkpoint}
    load_from_HF: false

  optim:
    amp:
      enabled: true
      amp_dtype: float16

    optimizer:
      _target_: torch.optim.AdamW
      fused: false
      foreach: false

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    # Vision/text encoders are frozen in trainer._freeze_phase1_backbones
    # (requires_grad=False + no_grad). Do not put them in AdamW.
    param_group_modifiers: []

    options:
      lr:
        - scheduler:  # decoder / transformer - the only part that trains in Phase 1
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    # Verified against sam3/train/trainer.py: the trainer ALWAYS writes a
    # rolling checkpoints/checkpoint.pt after every epoch; save_freq>0 also
    # keeps a numbered checkpoints/checkpoint_<epoch>.pt every N epochs (no
    # separate "best_checkpoint.pt" unless you also add a `meters:` block
    # above and list its key in `save_best_meters` - not configured here,
    # since there's no verified segmentation-mIoU meter class in this repo;
    # use finetuning/validate_checkpoint.py against saved checkpoints instead.
    save_freq: 1
    resume_from: null  # do not resume the previous NaN-crashed run

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: true
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/seismic_facies_phase1
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================
launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: spawn

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: false  # local single/multi-GPU by default - see finetuning/README.md
  cpus_per_task: 8
  port_range: [10000, 65000]
  constraint: null
